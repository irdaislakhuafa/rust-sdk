[package]
name = "rust-sdk"
version = "0.1.0"
edition = "2024"
authors = ["Name <irdhaislakhuafa@gmail.com>"]
description = "Rust Software Development Kit"
license = "MIT"
repository = "https://github.com/irdaislakhuafa/rust-sdk.git"

[lib]
name = "rust_sdk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
bcrypt = "0.19"
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.8"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
rust-s3 = { version = "0.38", default-features = false, features = ["sync-rustls-tls", "fail-on-err"] }
url = "2"